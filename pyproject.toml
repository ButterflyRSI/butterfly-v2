[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "butterfly-framework"
version = "2.0.0"
description = "A self-correcting constraint architecture for adaptive AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "RJ Thomas" }]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
voice = ["kokoro-onnx>=0.4", "numpy"]

[project.scripts]
butterfly = "butterfly.__main__:main"

[tool.setuptools]
packages = ["butterfly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
